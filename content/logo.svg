<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 芯片主体 -->
  <rect x="20" y="20" width="160" height="160" rx="12" fill="#1a1a2e" stroke="#3b82f6" stroke-width="4"/>
  <!-- 芯片内电路区域 -->
  <rect x="60" y="60" width="80" height="80" rx="6" fill="#16213e" stroke="#3b82f6" stroke-width="2"/>
  <!-- 核心处理器符号 -->
  <rect x="85" y="85" width="30" height="30" rx="4" fill="#3b82f6" opacity="0.8"/>
  <!-- 引脚 - 上 -->
  <rect x="45" y="12" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="65" y="12" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="85" y="12" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="105" y="12" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="125" y="12" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="145" y="12" width="10" height="8" rx="2" fill="#60a5fa"/>
  <!-- 引脚 - 下 -->
  <rect x="45" y="180" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="65" y="180" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="85" y="180" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="105" y="180" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="125" y="180" width="10" height="8" rx="2" fill="#60a5fa"/>
  <rect x="145" y="180" width="10" height="8" rx="2" fill="#60a5fa"/>
  <!-- 引脚 - 左 -->
  <rect x="12" y="45" width="8" height="10" rx="2" fill="#60a5fa"/>
  <rect x="12" y="70" width="8" height="10" rx="2" fill="#60a5fa"/>
  <rect x="12" y="95" width="8" height="10" rx="2" fill="#60a5fa"/>
  <rect x="12" y="120" width="8" height="10" rx="2" fill="#60a5fa"/>
  <rect x="12" y="145" width="8" height="10" rx="2" fill="#60a5fa"/>
  <!-- 引脚 - 右 -->
  <rect x="180" y="45" width="8" height="10" rx="2" fill="#60a5fa"/>
  <rect x="180" y="70" width="8" height="10" rx="2" fill="#60a5fa"/>
  <rect x="180" y="95" width="8" height="10" rx="2" fill="#60a5fa"/>
  <rect x="180" y="120" width="8" height="10" rx="2" fill="#60a5fa"/>
  <rect x="180" y="145" width="8" height="10" rx="2" fill="#60a5fa"/>
</svg>
