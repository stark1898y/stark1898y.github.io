[project]
site_name = "Stark's 知识库"
site_description = "嵌入式开发笔记、开源项目、学习记录与在线工具"
site_url = "https://www.stark1898y.cc/"
repo_url = "https://github.com/stark1898y/stark1898y.github.io"
repo_name = "stark1898y/stark1898y.github.io"
edit_uri = "edit/main/content/"
docs_dir = "content"
site_dir = "site"
extra_css = ["stylesheets/home.css", "stylesheets/footer.css"]
extra_javascript = ["javascripts/footer.js"]
# Days since current Vercel site's project creation (2026-08-10); not a live uptime SLA.
# Change data-stark-site-since if the intended site launch date differs.
copyright = """© 2022–present Stark1898y · <span class="stark-footer-running" data-stark-site-since="2026-08-10T00:00:00+08:00" title="从 2026-08-10 起计算（建站天数，非服务器在线率）">建站于 2026-08-10</span> · Zensical · Vercel"""

[project.theme]
language = "zh"
logo = "logo.svg"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "search.highlight",
]

[project.plugins.awesome-nav]
[project.plugins.awesome-nav.logs]
no_matches = "info"

[project.plugins.blog]
# URL stays stable when the displayed publication date changes.
post_url_format = "{slug}"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]
