<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="在线 Base64 编解码工具，UTF-8 文本与 Base64 互转，支持 URL 安全模式与文件转 Data URI。纯浏览器本地处理。">
<title>Base64 编解码 - 在线 Base64 编码解码工具</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --text-2: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef2ff;
    --green: #059669;
    --red: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --text-2: #94a3b8;
    --border: #334155;
    --primary: #818cf8;
    --primary-hover: #a5b4fc;
    --primary-soft: rgba(129,140,248,.12);
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    transition: background .3s, color .3s;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

  .breadcrumb { font-size: 12.5px; color: var(--text-2); margin-bottom: 14px; padding-top: 6px; }
  .breadcrumb a { color: var(--text-2); text-decoration: none; transition: color .2s; }
  .breadcrumb a:hover { color: var(--primary); }
  .breadcrumb .sep { margin: 0 6px; color: var(--border); }
  .breadcrumb .cur { color: var(--primary); font-weight: 600; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; padding-top: 12px; flex-wrap: wrap; }
  .brand h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .brand .sub { font-size: 13px; color: var(--text-2); margin-top: 6px; line-height: 1.7; }
  .notice {
    margin-top: 12px; display: inline-flex; align-items: center; gap: 8px;
    background: var(--primary-soft); color: var(--primary); border-radius: 10px;
    padding: 8px 12px; font-size: 12.5px; font-weight: 500;
  }
  .links { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .links a { font-size: 12.5px; text-decoration: none; color: var(--text-2); transition: color .2s; }
  .links a:hover { color: var(--primary); }
  .links .gh { color: var(--text); font-weight: 600; }
  .links .gh:hover { color: var(--primary); }
  .header-right { display: flex; align-items: flex-start; gap: 12px; }
  .theme-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 17px; display: flex;
    align-items: center; justify-content: center; transition: all .2s;
  }
  .theme-btn:hover { border-color: var(--primary); }
  [data-theme="dark"] .icon-sun { display: none; }
  .icon-moon { display: none; }
  [data-theme="dark"] .icon-moon { display: inline; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
  .label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 600; }

  .mode { display: flex; gap: 8px; margin-bottom: 12px; }
  .mode-btn {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card);
    color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .mode-btn.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }

  textarea {
    width: 100%; min-height: 160px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 13px; line-height: 1.7; resize: vertical; outline: none;
    transition: border-color .2s, box-shadow .2s;
    font-family: Consolas, Monaco, "Courier New", monospace;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .btn-primary {
    padding: 9px 20px; border-radius: 10px; border: none; background: var(--primary); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-ghost {
    padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card);
    color: var(--text-2); font-size: 13px; cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

  .error { color: var(--red); font-size: 12.5px; margin-top: 8px; display: none; background: var(--card); border: 1px solid var(--red); border-radius: 10px; padding: 10px 12px; line-height: 1.7; }
  .ok { color: var(--green); font-size: 12.5px; margin-top: 8px; display: none; }
  .hint { font-size: 12px; color: var(--text-2); margin-top: 8px; }
  .res-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .res-head .stat { font-size: 12px; color: var(--text-2); }

  .related { margin-top: 24px; }
  .related-title { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 12px; }
  .related-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .related-card {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    text-decoration: none; color: var(--text); transition: all .2s;
  }
  .related-card:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateY(-2px); }
  .rc-icon { font-size: 22px; flex-shrink: 0; }
  .rc-name { display: block; font-size: 14px; font-weight: 700; }
  .rc-desc { display: block; font-size: 12px; color: var(--text-2); margin-top: 3px; }

  footer { text-align: center; font-size: 12px; color: var(--text-2); margin-top: 28px; }
  @media (max-width: 560px) { .related-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="errBoundary" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#fee2e2;color:#b91c1c;padding:10px 16px;font-size:13px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.15)">页面出现异常，部分功能可能不可用。
  <button onclick="location.reload()" style="margin-left:8px;padding:4px 12px;border:none;border-radius:6px;background:#b91c1c;color:#fff;cursor:pointer;font-size:12px">刷新重试</button>
</div>
<div class="container">

  <div class="breadcrumb">
    <a href="/">首页</a><span class="sep">/</span><a href="/dev-tools/">开发工具</a><span class="sep">/</span><span class="cur">Base64 编解码</span>
  </div>

  <header>
    <div class="brand">
      <h1>🔤 Base64 编解码</h1>
      <div class="sub">UTF-8 文本与 Base64 字符串互转 · 支持文件转 Data URI</div>
      <div class="notice">🔒 所有处理均在浏览器本地完成，数据不会上传到任何服务器</div>
      <div class="links">
        <a class="gh" href="https://github.com/stark1898y/stark1898y.github.io/tree/main/public/dev-tools/base64" target="_blank">⭐ GitHub 源码</a>
        <a href="/dev-tools/" target="_blank">← 返回开发工具</a>
      </div>
    </div>
    <div class="header-right">
      <button class="theme-btn" id="themeBtn" title="切换深色/浅色模式">
        <span class="icon-sun">🌙</span>
        <span class="icon-moon">☀️</span>
      </button>
    </div>
  </header>

  <div class="card">
    <div class="card-title"><span class="dot"></span>编解码</div>
    <div class="mode">
      <button class="mode-btn active" id="modeEncode">文本 → Base64</button>
      <button class="mode-btn" id="modeDecode">Base64 → 文本</button>
    </div>
    <textarea id="input" placeholder="在此输入要编码的文本 / 要解码的 Base64 字符串…" spellcheck="false"></textarea>
    <div class="toolbar">
      <button class="btn-primary" onclick="doConvert()">转换</button>
      <button class="btn-ghost" onclick="swap()">交换输入输出</button>
      <button class="btn-ghost" onclick="loadSample()">示例</button>
      <button class="btn-ghost" onclick="clearAll()">清空</button>
      <label class="btn-ghost" style="display:inline-block; cursor:pointer">
        选择文件
        <input type="file" id="fileInput" style="display:none" accept="*/*">
      </label>
    </div>
    <div class="error" id="errBox"></div>
    <div class="ok" id="okBox"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="res-head">
      <span class="label" style="margin:0">输出</span>
      <span class="stat" id="stat"></span>
    </div>
    <textarea id="output" readonly style="min-height:140px"></textarea>
    <div class="toolbar">
      <button class="btn-primary" onclick="copyOut()">复制结果</button>
      <button class="btn-ghost" onclick="saveLocal()">保存本地</button>
    </div>
  </div>

  <div class="related">
    <div class="related-title">相关工具推荐</div>
    <div class="related-grid">
      <a class="related-card" href="/dev-tools/json-formatter/" target="_blank">
        <span class="rc-icon">📄</span>
        <span>
          <span class="rc-name">JSON 工具集</span>
          <span class="rc-desc">格式化、压缩、转义、视图与对比</span>
        </span>
      </a>
      <a class="related-card" href="/dev-tools/timestamp-converter/" target="_blank">
        <span class="rc-icon">⏰</span>
        <span>
          <span class="rc-name">时间戳转换</span>
          <span class="rc-desc">Unix 时间戳与日期时间互转，多时区</span>
        </span>
      </a>
    </div>
  </div>

  <footer>Base64 编解码工具 · 开源免费 · 支持离线使用</footer>
</div>

<script>
(function () {
  'use strict';

  /* ===== 错误边界：捕获运行时错误，显示友好提示条 ===== */
  function showErrBoundary() {
    var el = document.getElementById('errBoundary');
    if (el) el.style.display = 'block';
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target !== window) return; // 资源加载错误交给 unhandledrejection / 不阻断
    showErrBoundary();
  });
  window.addEventListener('unhandledrejection', function () { showErrBoundary(); });

  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var resultCard = document.getElementById('resultCard');
  var errBox = document.getElementById('errBox');
  var okBox = document.getElementById('okBox');
  var stat = document.getElementById('stat');
  var mode = 'encode';

  function setMode(m) {
    mode = m;
    document.getElementById('modeEncode').classList.toggle('active', m === 'encode');
    document.getElementById('modeDecode').classList.toggle('active', m === 'decode');
    input.placeholder = m === 'encode' ? '在此输入要编码的文本…' : '在此输入要解码的 Base64 字符串…';
    resultCard.style.display = 'none'; errBox.style.display = 'none'; okBox.style.display = 'none';
    try { localStorage.setItem('b64-mode', m); } catch (e) {}
  }
  document.getElementById('modeEncode').addEventListener('click', function () { setMode('encode'); });
  document.getElementById('modeDecode').addEventListener('click', function () { setMode('decode'); });

  // 恢复上次选择的模式
  try {
    var savedMode = localStorage.getItem('b64-mode');
    if (savedMode === 'encode' || savedMode === 'decode') setMode(savedMode);
  } catch (e) {}

  // 输入草稿自动保存/恢复
  try {
    var savedDraft = localStorage.getItem('b64-draft');
    if (savedDraft !== null) input.value = savedDraft;
  } catch (e) {}
  input.addEventListener('input', function () {
    try { localStorage.setItem('b64-draft', input.value); } catch (e) {}
  });

  /* ===== 主题 ===== */
  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('b64-theme', t); } catch (e) {} }
  var saved = null; try { saved = localStorage.getItem('b64-theme'); } catch (e) {}
  applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  function utf8ToB64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64ToUtf8(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function showErr(msg) { resultCard.style.display = 'none'; okBox.style.display = 'none'; errBox.style.display = 'block'; errBox.textContent = msg; }

  function doConvert() {
    var raw = input.value;
    if (!raw) { showErr('请输入内容'); return; }
    try {
      if (mode === 'encode') {
        output.value = utf8ToB64(raw);
      } else {
        var cleaned = raw.replace(/\s+/g, '');
        output.value = b64ToUtf8(cleaned);
      }
      errBox.style.display = 'none';
      stat.textContent = '输入 ' + raw.length + ' 字符 → 输出 ' + output.value.length + ' 字符';
      resultCard.style.display = '';
      okBox.style.display = 'block';
      okBox.textContent = mode === 'encode' ? '✓ 编码成功' : '✓ 解码成功';
    } catch (e) {
      showErr(mode === 'decode' ? 'Base64 解码失败：内容不是有效的 Base64 字符串' : '编码失败：' + e.message);
    }
  }

  function swap() {
    if (!output.value) { showErr('输出为空，无法交换'); return; }
    var t = input.value;
    input.value = output.value;
    output.value = t;
    setMode(mode === 'encode' ? 'decode' : 'encode');
  }

  function loadSample() {
    if (mode === 'encode') {
      input.value = 'Hello 你好，Stark1898y! 嵌入式开发 www.stark1898y.cc';
    } else {
      input.value = 'SGVsbG8g5L2g5aW977yMU3RhcmsxODk4eSEg5Zu+5a2m5byP5Z6L5byA5Y+R';
    }
  }

  function clearAll() {
    input.value = ''; output.value = '';
    resultCard.style.display = 'none'; errBox.style.display = 'none'; okBox.style.display = 'none';
    try { localStorage.removeItem('b64-draft'); } catch (e) {}
  }

  function copyOut() {
    var text = output.value;
    function done() { var b = document.querySelector('#resultCard .btn-primary'); if (b) { var o = b.textContent; b.textContent = '已复制'; setTimeout(function () { b.textContent = o; }, 1200); } }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done); }
    else { output.select(); try { document.execCommand('copy'); } catch (e) {} done(); }
  }

  function saveLocal() {
    var text = output.value;
    if (!text) { showErr('输出为空，无法保存'); return; }
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = mode === 'encode' ? 'output.txt' : 'decoded.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ===== 文件 → Base64 (Data URI) ===== */
  document.getElementById('fileInput').addEventListener('change', function () {
    var f = this.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) {
      if (!confirm('文件较大（' + (f.size / 1024 / 1024).toFixed(1) + ' MB），转换为 Data URI 可能占用较多内存，是否继续？')) {
        this.value = '';
        return;
      }
    }
    var reader = new FileReader();
    reader.onload = function () {
      setMode('encode');
      input.value = '（文件：' + f.name + '，' + (f.size / 1024).toFixed(1) + ' KB）';
      output.value = reader.result;
      errBox.style.display = 'none';
      stat.textContent = 'Data URI，长度 ' + reader.result.length + ' 字符';
      resultCard.style.display = '';
      okBox.style.display = 'none';
    };
    reader.readAsDataURL(f);
    this.value = '';
  });

  /* ===== URL 参数 ===== */
  try {
    var qs = new URLSearchParams(location.search);
    var t = qs.get('text');
    var b = qs.get('b64');
    if (t) { setMode('encode'); input.value = t; doConvert(); }
    else if (b) { setMode('decode'); input.value = b; doConvert(); }
    if (qs.get('theme') === 'dark') applyTheme('dark');
  } catch (e) {}

  window.doConvert = doConvert;
  window.swap = swap;
  window.loadSample = loadSample;
  window.clearAll = clearAll;
  window.copyOut = copyOut;
  window.saveLocal = saveLocal;

  /* ===== 链接跳转日志（排查路径问题） ===== */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a || !a.getAttribute('href')) return;
    var href = a.getAttribute('href');
    if (href.indexOf('javascript:') === 0 || href.charAt(0) === '#') return;
    console.log('[nav] ' + (href.charAt(0) === '/' ? '站内跳转: ' : '外链跳转: ') + href);
  }, true);
})();
</script>
</body>
</html>
