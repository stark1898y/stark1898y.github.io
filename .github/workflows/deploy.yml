name: Deploy Zensical site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Zensical
        run: python -m pip install -r requirements-site.txt

      - name: Strict site build
        run: zensical build --clean --strict

      - name: Restore standalone HTML tools
        run: python scripts/zensical/restore_tools.py

      - name: Restore legacy VitePress URLs
        run: python scripts/zensical/restore_legacy_urls.py

      - name: Verify pages and search index
        run: python scripts/zensical/check_output.py

      - name: Audit local references
        run: python scripts/zensical/audit_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
