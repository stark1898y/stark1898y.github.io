name: Zensical migration checks

on:
  pull_request:
    paths:
      - 'zensical.toml'
      - '.pages.yml'
      - 'requirements-site.txt'
      - 'content/**'
      - 'public/dev-tools/**'
      - 'scripts/zensical/**'
      - '.github/workflows/zensical-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zensical-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zensical
        run: python -m pip install -r requirements-site.txt
      - name: Verify awesome-nav auto-discovery
        run: python scripts/zensical/check_nav.py
      - name: Build site
        run: zensical build --clean --strict
      - name: Restore standalone browser tools
        run: python scripts/zensical/restore_tools.py
      - name: Restore legacy VitePress article URLs
        run: python scripts/zensical/restore_legacy_urls.py
      - name: Verify key outputs
        run: python scripts/zensical/check_output.py
      - name: Audit links and static assets
        run: python scripts/zensical/audit_site.py
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Install CJK fonts for manually requested screenshot review
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-match 'sans:lang=zh-cn'
      - name: Browser smoke tests (desktop/mobile and tools)
        run: python scripts/zensical/smoke_browser.py
      - name: Upload preview artifact and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zensical-preview-${{ github.run_number }}
          path: |
            site/
            artifacts/site-audit.json
            artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14
